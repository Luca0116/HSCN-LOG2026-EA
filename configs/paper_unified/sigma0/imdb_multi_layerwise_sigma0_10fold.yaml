# Paper formulas assume sigma=0 so eta = lambda^2 + 1/t^2.
dataset: IMDB-MULTI
data_root: ./data
out_dir: ./runs
run_name: paper_unified_imdb_multi_layerwise_sigma0
ball_dim: 2
n_folds: 10
fold: null
val_ratio_within_trainval: 0.1
label_smoothing: 0.0
optimizer: adam
lr_factor: 0.5
lr_min: 1.0e-05
lr_patience: 20
grad_clip: 1.0
log_every: 20
eval_train_every: 5
device: cuda
seed: 42
activation: silu
batch_size: 32
classifier_dropout: 0.3
classifier_hidden_dim: 256
classifier_mode: mlp
classifier_num_layers: 2
complex_pair_mode: reim
conv_dropout: 0.4
dropout: 0.5
encoder_dropout: 0.2
feature_mode: mlp
hidden_dim: 96
lambda_max: 24.0
learnable_scales: false
lr: 0.0005430319818467294
max_scale: 8.0
min_epochs_for_best: 10
min_scale: 0.1
norm_mode: pre
num_directions: 8
num_lambdas: 32
num_layers: 2
num_scales: 6
patience: 40
post_conv_dropout: 0.2
post_conv_mlp_hidden_dim: 128
radius: 1.0
readout_dropout: 0.1
readout_mode: layerwise_hybrid
sarkar_tau: 0.25
scale_mode: octave
sigma: 0.0
use_post_conv_mlp: true
weight_decay: 0.0005
epochs: 400
min_epochs: 20
