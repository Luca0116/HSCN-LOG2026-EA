# Paper formulas assume sigma=0 so eta = lambda^2 + 1/t^2.
dataset: IMDB-BINARY
data_root: ./data
out_dir: ./runs
run_name: paper_unified_imdb_binary_layerwise_sigma0
feature_mode: mlp
use_post_conv_mlp: true
post_conv_mlp_hidden_dim: 128
post_conv_dropout: 0.1
readout_mode: layerwise_hybrid
complex_pair_mode: reim
classifier_mode: mlp
classifier_num_layers: 2
classifier_hidden_dim: 256
norm_mode: pre
ball_dim: 2
hidden_dim: 32
num_layers: 2
num_scales: 3
scale_mode: logspace
min_scale: 0.2
max_scale: 12.0
learnable_scales: false
num_lambdas: 24
lambda_max: 16.0
num_directions: 16
radius: 1.25
sigma: 0.0
sarkar_tau: 0.5
activation: gelu
conv_dropout: 0.4
classifier_dropout: 0.6
readout_dropout: 0.2
encoder_dropout: 0.3
dropout: 0.5
batch_size: 128
n_folds: 10
val_ratio_within_trainval: 0.1
lr: 0.0004974617557736819
weight_decay: 0.005
label_smoothing: 0.1
optimizer: adam
lr_factor: 0.5
lr_min: 1.0e-05
epochs: 400
patience: 60
min_epochs: 20
min_epochs_for_best: 15
lr_patience: 20
grad_clip: 1.0
log_every: 20
eval_train_every: 5
seed: 42
device: cuda
